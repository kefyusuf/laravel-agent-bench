name: benchmark

on:
  push:
    branches: [main]
  pull_request:

jobs:
  structural:
    name: structural validation + harness tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test test/
      - run: node bin/bench.mjs validate

  dynamic:
    name: dynamic gate (RED/GREEN/DISTRACTOR)
    needs: structural
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - cell: laravel-13
            php: '8.3'
          - cell: laravel-13
            php: '8.4'
          - cell: laravel-12
            php: '8.2'
          - cell: laravel-12
            php: '8.3'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: redis
      - name: Bring up the Redis cluster (for redis-cluster scenarios)
        run: docker compose --profile redis-cluster up -d --wait redis-1 redis-2 redis-3 redis-cluster-init
      - name: Bring up single Redis (for redis scenarios)
        run: docker compose --profile redis up -d --wait redis
      - name: Export Redis endpoints for native phpunit
        run: |
          echo "REDIS_SEEDS=127.0.0.1:16379,127.0.0.1:16380,127.0.0.1:16381" >> "$GITHUB_ENV"
          echo "REDIS_RACE_HOST=127.0.0.1:16382" >> "$GITHUB_ENV"
      - name: Lint all PHP in snapshots and hidden tests
        run: |
          find scenarios -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
      - name: Build vendor cache
        run: node bin/bench.mjs vendor:prepare --cell ${{ matrix.cell }}
      - name: Run dynamic validation
        run: node bin/bench.mjs validate --dynamic --cell ${{ matrix.cell }} --json --out dynamic-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dynamic-report-${{ matrix.cell }}-php${{ matrix.php }}
          path: dynamic-report.json
          retention-days: 14
